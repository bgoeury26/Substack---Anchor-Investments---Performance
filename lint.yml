# lint.yml
# Runs on every push: checks Python syntax and imports.
# (Note: this file lives at the repo root, not .github/workflows/, so it is
# not actually wired up as a GitHub Actions workflow. Move it to
# .github/workflows/lint.yml to activate it.)

name: Lint & Check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check syntax (py_compile)
        run: python -m py_compile app.py config.py db.py auth.py data_loader.py portfolio_engine.py charts.py migrate_legacy.py

      - name: Run import checks
        run: |
          python -c "import config, db, auth, data_loader, portfolio_engine, charts"
        env:
          ADMIN_PASSWORD_HASH: "$2b$12$placeholder"
          DATABASE_URL: "sqlite:///data/portfolio.db"
